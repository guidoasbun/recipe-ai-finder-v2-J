# Test application properties - provides dummy values for context loading
spring.application.name=backend-test

# Server
server.tomcat.max-http-form-post-size=1048576
server.tomcat.max-swallow-size=1048576

# AWS region
aws.region=us-east-1

# DynamoDB
dynamodb.users-table=Users-test
dynamodb.recipes-table=Recipes-test
dynamodb.consent-table=Consent-test
dynamodb.audit-table=AuditLog-test

# S3
s3.bucket=recipe-images-test

# Image generation APIs
stability.api-key=test-key
openai.api-key=test-key
google.api-key=test-key

# Cognito
cognito.user-pool-id=us-east-1_TestPool

# Compliance
compliance.deletion.cron=0 0 2 * * *

# JWT - use a dummy issuer URI for test context loading
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://cognito-idp.us-east-1.amazonaws.com/us-east-1_TestPool

# CORS
cors.allowed-origins=http://localhost:3000

# Rate limiting test user
testuser.email=testuser@test.com
testuser.generate-call-limit=40
