spring.application.name=backend
server.port=8080
server.tomcat.connection-timeout=120s

# CORS - override in application-local.properties for dev
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# AWS region - ECS injects AWS_REGION automatically; fallback for local dev
aws.region=${AWS_REGION:us-east-1}

# DynamoDB
dynamodb.users-table=${DYNAMODB_USERS_TABLE:Users}
dynamodb.recipes-table=${DYNAMODB_RECIPES_TABLE:Recipes}
dynamodb.consent-table=${DYNAMODB_CONSENT_TABLE:Consent}
dynamodb.audit-table=${DYNAMODB_AUDIT_TABLE:AuditLog}

# S3
s3.bucket=${S3_BUCKET:recipe-images-dev}

# Image generation APIs
stability.api-key=${STABILITY_API_KEY:}
openai.api-key=${OPENAI_API_KEY:}
google.api-key=${GOOGLE_API_KEY:}

# Cognito
cognito.user-pool-id=${COGNITO_USER_POOL_ID:us-east-1_example}

# Compliance - scheduled deletion
compliance.deletion.cron=${COMPLIANCE_DELETION_CRON:0 0 2 * * *}

# JWT issuer - uncomment in Phase 8 when Cognito exists
spring.security.oauth2.resourceserver.jwt.issuer-uri=${COGNITO_ISSUER_URI}

# Rate limiting for shared demo/test account
testuser.email=${TESTUSER_EMAIL:testuser1@mail.com}
testuser.generate-call-limit=${TESTUSER_GENERATE_CALL_LIMIT:40}
