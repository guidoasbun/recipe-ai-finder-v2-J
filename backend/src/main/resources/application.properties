spring.application.name=backend
server.port=8080
server.tomcat.connection-timeout=120s
server.tomcat.max-http-form-post-size=1048576
server.tomcat.max-swallow-size=1048576

# CORS - override in application-local.properties for dev
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# AWS region - ECS injects AWS_REGION automatically; fallback for local dev
aws.region=${AWS_REGION:us-east-1}

# DynamoDB
dynamodb.users-table=${DYNAMODB_USERS_TABLE:Users}
dynamodb.recipes-table=${DYNAMODB_RECIPES_TABLE:Recipes}
dynamodb.consent-table=${DYNAMODB_CONSENT_TABLE:Consent}
dynamodb.audit-table=${DYNAMODB_AUDIT_TABLE:AuditLog}
dynamodb.catalog-table=${DYNAMODB_CATALOG_TABLE:recipe-ai-dev-catalog}
# Full 2.2M catalog table for the OpenSearch backend (rollback preservation, design §6.0).
# Defaults to the small table so ingestion/reindex target it until the full load is set up.
dynamodb.catalog-full-table=${DYNAMODB_CATALOG_FULL_TABLE:${DYNAMODB_CATALOG_TABLE:recipe-ai-dev-catalog}}

# Catalog search (Look for Existing Recipes)
catalog.search.backend=${CATALOG_SEARCH_BACKEND:inapp}
catalog.search.semantic-enabled=${CATALOG_SEMANTIC:true}
catalog.search.mode=${CATALOG_SEARCH_MODE:hybrid}
catalog.search.page-size-default=${CATALOG_PAGE_SIZE_DEFAULT:20}
catalog.search.page-size-max=${CATALOG_PAGE_SIZE_MAX:50}

# Bedrock embeddings (Titan Text Embeddings V2)
bedrock.embedding.model-id=${BEDROCK_EMBEDDING_MODEL_ID:amazon.titan-embed-text-v2:0}

# Catalog reindex (DynamoDB -> OpenSearch); one-off, never runs on normal boot
catalog.reindex.enabled=${CATALOG_REINDEX_ENABLED:false}
catalog.reindex.batch-size=${CATALOG_REINDEX_BATCH_SIZE:500}

# OpenSearch backend (only used when catalog.search.backend=opensearch)
# endpoint: https host of the serverless collection or managed domain (no scheme required)
opensearch.endpoint=${OPENSEARCH_ENDPOINT:}
opensearch.index=${OPENSEARCH_INDEX:catalog-recipes}
# aoss = Serverless (default flavor); es = managed domain
opensearch.signing-service=${OPENSEARCH_SIGNING_SERVICE:aoss}
opensearch.knn.ef-search=${OPENSEARCH_KNN_EF_SEARCH:100}
# none | fp16  (leave none until the full 2.2M load; fp16 ≈ half the vector memory. see design.md §3)
opensearch.knn.quantization=${OPENSEARCH_KNN_QUANTIZATION:none}

# Catalog ingestion (Phase 1: TheMealDB xlsx export)
catalog.ingest.enabled=${CATALOG_INGEST_ENABLED:false}
catalog.ingest.source-dir=${CATALOG_INGEST_SOURCE_DIR:data/archive}
catalog.ingest.rpm-limit=${CATALOG_INGEST_RPM_LIMIT:300}
# Embedding strategy for ingestion: sync (<=50K, paced) | batch (full 2.2M, Bedrock Batch Inference)
catalog.ingest.embedding-strategy=${CATALOG_INGEST_EMBEDDING_STRATEGY:sync}
# RecipeNLG source (Phase 2). Empty path => source not loaded. Cap <=0 => no cap (full set).
catalog.ingest.recipenlg-file=${CATALOG_INGEST_RECIPENLG_FILE:}
catalog.ingest.recipenlg-max-records=${CATALOG_INGEST_RECIPENLG_MAX_RECORDS:0}

# Bedrock Batch Inference (used only when catalog.ingest.embedding-strategy=batch)
bedrock.batch.input-bucket=${BEDROCK_BATCH_INPUT_BUCKET:}
bedrock.batch.output-bucket=${BEDROCK_BATCH_OUTPUT_BUCKET:}
bedrock.batch.role-arn=${BEDROCK_BATCH_ROLE_ARN:}
bedrock.batch.poll-seconds=${BEDROCK_BATCH_POLL_SECONDS:60}
# Recipes per batch job. Bounds memory (one chunk of texts+vectors in flight) and keeps each
# job under Bedrock per-job record limits. Each chunk is persisted before the next is loaded.
catalog.ingest.batch-chunk-size=${CATALOG_INGEST_BATCH_CHUNK_SIZE:50000}

# S3
s3.bucket=${S3_BUCKET:recipe-images-dev}

# Image generation APIs
stability.api-key=${STABILITY_API_KEY:}
openai.api-key=${OPENAI_API_KEY:}
google.api-key=${GOOGLE_API_KEY:}

# Cognito
cognito.user-pool-id=${COGNITO_USER_POOL_ID:us-east-1_example}

# Compliance - scheduled deletion
compliance.deletion.cron=${COMPLIANCE_DELETION_CRON:0 0 2 * * *}

# JWT issuer - uncomment in Phase 8 when Cognito exists
spring.security.oauth2.resourceserver.jwt.issuer-uri=${COGNITO_ISSUER_URI}

# Rate limiting for shared demo/test account
testuser.email=${TESTUSER_EMAIL:testuser1@mail.com}
testuser.generate-call-limit=${TESTUSER_GENERATE_CALL_LIMIT:40}
