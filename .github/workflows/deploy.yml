name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'dev'
        type: choice
        options: [dev, prod]
      deploy_target:
        description: 'What to deploy'
        required: true
        default: 'all'
        type: choice
        options: [all, waf-only, app-only]

permissions:
  id-token: write
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true


jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'dev' }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      # ──────────────────────────────────────────────────────────────
      # Application Build & Push (skipped for waf-only deployments)
      # ──────────────────────────────────────────────────────────────
      - name: Login to ECR
        if: github.event.inputs.deploy_target != 'waf-only'
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        if: github.event.inputs.deploy_target != 'waf-only'
        uses: docker/setup-buildx-action@v3
        with:
          platforms: linux/arm64

      - name: Set image tag
        if: github.event.inputs.deploy_target != 'waf-only'
        run: echo "IMAGE_TAG=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Build and push backend
        if: github.event.inputs.deploy_target != 'waf-only'
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./docker/backend.Dockerfile
          platforms: linux/arm64
          push: true
          provenance: false
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/recipe-ai/backend:latest
            ${{ steps.ecr-login.outputs.registry }}/recipe-ai/backend:${{ env.IMAGE_TAG }}

      - name: Build and push frontend
        if: github.event.inputs.deploy_target != 'waf-only'
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./docker/frontend.Dockerfile
          platforms: linux/arm64
          push: true
          provenance: false
          build-args: |
            BACKEND_URL=https://recipe-ai-finder.com
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/recipe-ai/frontend:latest
            ${{ steps.ecr-login.outputs.registry }}/recipe-ai/frontend:${{ env.IMAGE_TAG }}

      # ──────────────────────────────────────────────────────────────
      # WAF Infrastructure Deployment (skipped for app-only deployments)
      # To deploy WAF independently: use workflow_dispatch with deploy_target=waf-only.
      # Each environment uses a separate backend state key for isolation.
      # ──────────────────────────────────────────────────────────────
      - name: Setup Terraform
        if: github.event.inputs.deploy_target != 'app-only'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: Terraform Init (WAF)
        if: github.event.inputs.deploy_target != 'app-only'
        working-directory: ./infrastructure/waf
        run: |
          ENV="${{ github.event.inputs.environment || 'dev' }}"
          terraform init -reconfigure \
            -backend-config="key=recipe-ai-waf/${ENV}/terraform.tfstate"

      - name: Terraform Plan (WAF)
        if: github.event.inputs.deploy_target != 'app-only'
        working-directory: ./infrastructure/waf
        timeout-minutes: 10
        run: |
          terraform plan \
            -var-file=environments/${{ github.event.inputs.environment || 'dev' }}.tfvars \
            -out=tfplan

      - name: Terraform Apply (WAF)
        if: github.event.inputs.deploy_target != 'app-only'
        working-directory: ./infrastructure/waf
        timeout-minutes: 10
        run: terraform apply -auto-approve tfplan

      - name: Verify WAF Association
        if: github.event.inputs.deploy_target != 'app-only'
        run: |
          ENV="${{ github.event.inputs.environment || 'dev' }}"
          EXPECTED_ACL="recipe-ai-${ENV}-web-acl"
          ALB_ARN=$(aws elbv2 describe-load-balancers \
            --names "recipe-ai-${ENV}-alb" \
            --query 'LoadBalancers[0].LoadBalancerArn' --output text)
          WEB_ACL=$(aws wafv2 get-web-acl-for-resource \
            --resource-arn "$ALB_ARN" \
            --query 'WebACL.Name' --output text 2>/dev/null || true)
          if [ "$WEB_ACL" != "$EXPECTED_ACL" ]; then
            echo "ERROR: Expected WAF Web ACL '${EXPECTED_ACL}' but got '${WEB_ACL}'"
            exit 1
          fi
          echo "WAF Web ACL '${WEB_ACL}' correctly associated with ALB"

      # ──────────────────────────────────────────────────────────────
      # ECS Deployment (skipped for waf-only deployments)
      # ──────────────────────────────────────────────────────────────
      - name: Deploy to ECS
        if: github.event.inputs.deploy_target != 'waf-only'
        run: |
          ENV="${{ github.event.inputs.environment || 'dev' }}"
          aws ecs update-service \
            --cluster "recipe-ai-${ENV}-cluster" \
            --service "recipe-ai-${ENV}-backend" \
            --force-new-deployment > /dev/null
          aws ecs update-service \
            --cluster "recipe-ai-${ENV}-cluster" \
            --service "recipe-ai-${ENV}-frontend" \
            --force-new-deployment > /dev/null
