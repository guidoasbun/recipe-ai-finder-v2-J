name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'dev'
        type: choice
        options: [dev, prod]

permissions:
  id-token: write
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true


jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'dev' }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          platforms: linux/arm64

      - name: Set image tag
        run: echo "IMAGE_TAG=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./docker/backend.Dockerfile
          platforms: linux/arm64
          push: true
          provenance: false
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/recipe-ai/backend:latest
            ${{ steps.ecr-login.outputs.registry }}/recipe-ai/backend:${{ env.IMAGE_TAG }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./docker/frontend.Dockerfile
          platforms: linux/arm64
          push: true
          provenance: false
          build-args: |
            BACKEND_URL=https://recipe-ai-finder.com
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/recipe-ai/frontend:latest
            ${{ steps.ecr-login.outputs.registry }}/recipe-ai/frontend:${{ env.IMAGE_TAG }}

      # ──────────────────────────────────────────────────────────────
      # WAF Infrastructure Deployment
      # WAF changes deploy alongside application changes via this workflow.
      # To deploy WAF independently of application code: use workflow_dispatch
      # with the environment input (dev/prod). The WAF steps below run before
      # ECS deployment, so a manual dispatch deploys WAF + app together.
      # No separate workflow is needed — infrastructure/waf/ changes are
      # applied on every run of this pipeline.
      # ──────────────────────────────────────────────────────────────
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: Terraform Init (WAF)
        working-directory: ./infrastructure/waf
        run: terraform init

      - name: Terraform Plan (WAF)
        working-directory: ./infrastructure/waf
        timeout-minutes: 10
        run: |
          terraform plan \
            -var-file=environments/${{ github.event.inputs.environment || 'dev' }}.tfvars \
            -out=tfplan

      - name: Terraform Apply (WAF)
        working-directory: ./infrastructure/waf
        timeout-minutes: 10
        run: terraform apply -auto-approve tfplan

      - name: Verify WAF Association
        run: |
          ENV="${{ github.event.inputs.environment || 'dev' }}"
          ALB_ARN=$(aws elbv2 describe-load-balancers \
            --names "recipe-ai-${ENV}-alb" \
            --query 'LoadBalancers[0].LoadBalancerArn' --output text)
          WEB_ACL=$(aws wafv2 get-web-acl-for-resource \
            --resource-arn "$ALB_ARN" \
            --query 'WebACL.Name' --output text 2>/dev/null || true)
          if [ -z "$WEB_ACL" ] || [ "$WEB_ACL" = "None" ]; then
            echo "ERROR: No WAF Web ACL associated with ALB"
            exit 1
          fi
          echo "WAF Web ACL '$WEB_ACL' associated with ALB"

      - name: Deploy to ECS
        run: |
          ENV="${{ github.event.inputs.environment || 'dev' }}"
          aws ecs update-service \
            --cluster "recipe-ai-${ENV}-cluster" \
            --service "recipe-ai-${ENV}-backend" \
            --force-new-deployment > /dev/null
          aws ecs update-service \
            --cluster "recipe-ai-${ENV}-cluster" \
            --service "recipe-ai-${ENV}-frontend" \
            --force-new-deployment > /dev/null
